<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5ead8">
  <title>绝境：吴家村</title>
  <link rel="stylesheet" href="assets/fonts/ui-kai.css">
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main id="game" data-screen="menu" aria-label="吴家村战术沙盘">
    <div id="viewport" aria-label="山村场景"></div>
    <section id="start-screen" class="start-screen" aria-label="开始界面">
      <div class="start-veil" aria-hidden="true"></div>
      <h1 class="start-title"><img src="assets/titles/wujiacun-ink.png" alt="绝境：吴家村" width="2172" height="724" draggable="false"></h1>
      <button id="start-game" class="ink-button start-button" data-ink-frame="button" type="button" disabled><span>开始游戏</span></button>
    </section>
    <div class="hud tools">
      <button id="pause-game" class="ink-button pause-button" type="button" aria-label="暂停游戏" aria-pressed="false" title="暂停游戏（空格）">
        <svg class="pause-icon" viewBox="0 0 36 36" aria-hidden="true">
          <g class="pause-bars" fill="#eeeade" stroke="#504d43" stroke-width="1.2" stroke-linejoin="round">
            <path d="M7 6Q11 4.8 14 6L14.2 29Q11 30.8 7 29Z"/><path d="M22 6Q25.5 4.7 29 6L28.6 29Q25.4 30.5 22 29Z"/>
          </g>
          <path class="play-mark" fill="#eeeade" stroke="#504d43" stroke-width="1.4" stroke-linejoin="round" d="M11 5.5 28 18 11.5 30Z"/>
        </svg>
      </button>
      <button id="wave-replay" class="ink-button" data-ink-frame="button" type="button" title="重新开始三波守村战斗"><span>重新开局</span></button>
    </div>
    <div class="hud wave-info" data-ink-frame="wave" role="status"><span id="wave-status">第 1 / 3 波</span></div>
    <footer class="hud command" data-open="false" aria-hidden="true" inert>
      <button id="squad-card" class="squad-card" type="button" aria-pressed="false" aria-label="守村队，取消选择" hidden>
        <span class="portrait-window"><img class="portrait" src="assets/portraits/militia.png" alt="草帽蓝衣的守村队领队" width="1254" height="1254" draggable="false"></span>
        <span class="squad-copy"><strong>守村队 <small id="squad-state">6 / 6</small></strong><span class="pips" aria-label="6 人"><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
      </button>
      <button id="engineer-card" class="squad-card engineers" type="button" aria-pressed="false" aria-label="工程师，取消选择" hidden>
        <span class="portrait-window"><img class="portrait" src="assets/portraits/engineer.png" alt="白头巾橙衣的工程师领队" width="1254" height="1254" draggable="false"></span>
        <span class="squad-copy"><strong>工程师 <small id="engineer-state">3 / 3</small></strong><span class="pips" aria-label="3 人"><i></i><i></i><i></i></span>
          <span id="engineer-work" class="work-progress" hidden aria-label="三名工程师的灭火进度"><span><i></i></span><span><i></i></span><span><i></i></span></span>
        </span>
      </button>
    </footer>
    <div id="battle-result" class="battle-result" hidden>
      <div class="result-card" data-ink-frame="panel">
        <p class="result-place">吴家村 · 守村战</p>
        <h2 id="result-title">村庄守住了</h2>
        <p id="result-detail"></p>
        <button id="restart-battle" class="ink-button" data-ink-frame="button" type="button">再守一次</button>
      </div>
    </div>
    <noscript>请启用 JavaScript 以查看山村沙盘。</noscript>
    <p id="error" role="alert" hidden>场景需要支持 WebGL 2 的浏览器，请检查浏览器的图形加速设置。</p>
  </main>
</body>
</html>
