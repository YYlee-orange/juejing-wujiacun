<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5ead8">
  <title>绝境：吴家村</title>
  <link rel="stylesheet" href="assets/fonts/ui-kai.css">
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main id="game" data-screen="menu" aria-label="吴家村战术沙盘">
    <div id="viewport" aria-label="山村场景"></div>
    <section id="start-screen" class="start-screen" aria-label="开始界面">
      <div class="start-veil" aria-hidden="true"></div>
      <h1 class="start-title"><img src="assets/titles/wujiacun-ink.png" alt="绝境：吴家村" width="2172" height="724" draggable="false"></h1>
      <button id="start-game" class="ink-button start-button" data-ink-frame="button" type="button" disabled><span>展开地图</span></button>
    </section>
    <section id="level-screen" class="level-screen" aria-label="选择关卡" aria-hidden="true" hidden inert>
      <div class="map-scroll" aria-label="山川画轴，可左右拖动，或使用左右方向键浏览">
        <div class="map-track">
          <div class="map-mount" aria-hidden="true"></div>
          <div class="map-sheet">
            <svg class="map-ink-border" aria-hidden="true"></svg>
            <h2 class="map-title"><span>吴家岭</span></h2>
            <div class="map-art">
          <img class="map-painting" src="assets/maps/shanchuan-scroll-v5.png" alt="青绿山川舆图长卷" draggable="false" decoding="async">
          <canvas class="map-atmosphere" aria-hidden="true"></canvas>
          <div class="map-location">
            <button id="level-one" class="level-node" type="button" aria-label="第 1 关，吴家村，进入关卡">
              <span class="village-art-window"><img class="level-village" src="assets/maps/wujiacun-village-v3.png" alt="" draggable="false" decoding="async"></span>
            </button>
            <span class="level-name"><svg class="map-name-paper" viewBox="0 0 32 98" preserveAspectRatio="none" aria-hidden="true"><path d="M3 3 16 2 29 4 28.5 48 29 94 17 95 3 94 3.5 51Z" fill="#eee4cdd9"/><path d="M3 3 16 2 29 4 28.5 48 29 94 17 95 3 94 3.5 51Z" fill="none" stroke="#6b604c" stroke-width="1.15"/><path d="m4.8 5 10-.6 11 .7M4.9 7l.2 37-.6 33M6 92l11 .5 9-.7M27 8l-.4 23 .4 36" fill="none" stroke="#6b604c" stroke-width=".5" opacity=".58"/></svg><span>吴家村</span></span>
          </div>
            </div>
          </div>
        </div>
      </div>
      <button id="map-back" class="ink-button map-back" data-ink-frame="button" type="button">返回</button>
    </section>
    <div id="play-ui" class="play-ui">
    <div class="hud tools">
      <button id="pause-game" class="ink-button pause-button" type="button" aria-label="打开暂停菜单" aria-controls="pause-menu" aria-haspopup="dialog" aria-expanded="false" aria-pressed="false" title="打开暂停菜单（空格）">
        <svg class="pause-icon" viewBox="0 0 36 36" aria-hidden="true">
          <g class="pause-bars" fill="#eeeade" stroke="#504d43" stroke-width="1.2" stroke-linejoin="round">
            <path d="M7 6Q11 4.8 14 6L14.2 29Q11 30.8 7 29Z"/><path d="M22 6Q25.5 4.7 29 6L28.6 29Q25.4 30.5 22 29Z"/>
          </g>
          <path class="play-mark" fill="#eeeade" stroke="#504d43" stroke-width="1.4" stroke-linejoin="round" d="M11 5.5 28 18 11.5 30Z"/>
        </svg>
      </button>
    </div>
    <div class="hud wave-info" data-ink-frame="wave" role="status"><span id="wave-status">第 1 / 3 波</span></div>
    <footer class="hud command" data-open="false" aria-hidden="true" inert>
      <button id="squad-card" class="squad-card" type="button" aria-pressed="false" aria-label="守村队，取消选择" hidden>
        <span class="portrait-window"><img class="portrait" src="assets/portraits/militia.png" alt="草帽蓝衣的守村队领队" width="1254" height="1254" draggable="false"></span>
        <span class="squad-copy"><strong>守村队 <small id="squad-state">6 / 6</small></strong><span class="pips" aria-label="6 人"><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
      </button>
      <button id="engineer-card" class="squad-card engineers" type="button" aria-pressed="false" aria-label="工程师，取消选择" hidden>
        <span class="portrait-window"><img class="portrait" src="assets/portraits/engineer.png" alt="白头巾橙衣的工程师领队" width="1254" height="1254" draggable="false"></span>
        <span class="squad-copy"><strong>工程师 <small id="engineer-state">3 / 3</small></strong><span class="pips" aria-label="3 人"><i></i><i></i><i></i></span>
          <span id="engineer-work" class="work-progress" hidden aria-label="三名工程师的灭火进度"><span><i></i></span><span><i></i></span><span><i></i></span></span>
        </span>
      </button>
    </footer>
    </div>
    <section id="pause-menu" class="pause-menu" role="dialog" aria-modal="true" aria-labelledby="pause-title" aria-hidden="true" hidden inert>
      <div class="pause-backdrop" aria-hidden="true"></div>
      <div class="pause-panel" data-ink-frame="panel">
        <button id="close-pause" class="ink-button menu-close" type="button" aria-label="关闭暂停菜单"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 5 13 13-1.8 1.5L4.7 6.4Zm12.5-.5 1 1.7L6 19l-1.3-1.4Z" fill="currentColor"/></svg></button>
        <h2 id="pause-title">暂停</h2>
        <div class="pause-actions">
          <button id="resume-game" class="ink-button" data-ink-frame="button" type="button">继续游戏</button>
          <button id="pause-restart" class="ink-button" data-ink-frame="button" type="button">重新开始</button>
          <button id="return-to-menu" class="ink-button" data-ink-frame="button" type="button">回到开始界面</button>
        </div>
      </div>
    </section>
    <div id="battle-result" class="battle-result" hidden>
      <div class="result-card" data-ink-frame="panel">
        <p class="result-place">吴家村 · 守村战</p>
        <h2 id="result-title">村庄守住了</h2>
        <p id="result-detail"></p>
        <button id="restart-battle" class="ink-button" data-ink-frame="button" type="button">再守一次</button>
      </div>
    </div>
    <noscript>请启用 JavaScript 以查看山村沙盘。</noscript>
    <p id="error" role="alert" hidden>场景需要支持 WebGL 2 的浏览器，请检查浏览器的图形加速设置。</p>
    <canvas id="scene-transition" class="scene-transition" aria-hidden="true" hidden></canvas>
  </main>
</body>
</html>
