<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5ead8">
  <title>绝境吴家村 · 山村沙盘</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main id="game" aria-label="吴家村战术沙盘">
    <div id="viewport" aria-label="山村场景"></div>
    <div class="hud tools">
      <button id="wave-replay" type="button" title="重新开始三波守村战斗">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2-3 5 2 3-3 6 4 2 3-6-2-3 3-6Z"/></svg>
        重新开局
      </button>
    </div>
    <div class="hud wave-info" role="status"><span id="wave-status">第 1 / 3 波</span></div>
    <footer class="hud command">
      <button id="squad-card" class="squad-card" type="button" aria-pressed="false" aria-label="选择守村队">
        <svg class="portrait" viewBox="0 0 56 60" aria-hidden="true">
          <path fill="#ab6345" d="M0 0h56v54l-28 6L0 54Z"/>
          <path fill="#8b4b35" d="M28 9 51 28l-4 27-19 5L0 54V39Z"/>
          <path fill="#354e4e" d="m11 54 4-13 11-5h4l11 5 4 13-17 4Z"/>
          <path fill="#e7b283" d="M20 26h16v9l-8 7-8-7Z"/>
          <path fill="#6c4c37" d="M20 26h16v4H20Z"/>
          <path fill="#e7c58d" d="m8 28 17-16h6l17 16-20 3Z"/>
          <path fill="#c79763" d="m28 12 20 16-20 3Z"/>
          <path fill="#e6d2a4" d="M26 42h5l-1 11-4-3Z"/>
          <path fill="#654c3a" d="M23 32h2v2h-2zm8 0h2v2h-2z"/>
        </svg>
        <span class="squad-copy"><strong>守村队 <small id="squad-state">6 / 6</small></strong><span class="pips" aria-label="6 人"><i></i><i></i><i></i><i></i><i></i><i></i></span></span>
      </button>
      <button id="engineer-card" class="squad-card engineers" type="button" aria-pressed="false" aria-label="选择工程师">
        <svg class="portrait" viewBox="0 0 56 60" aria-hidden="true">
          <path fill="#477c9a" d="M0 0h56v54l-28 6L0 54Z"/>
          <path fill="#315b76" d="m27 12 24 18-4 25-19 5L0 54V39Z"/>
          <path fill="#d47732" d="m10 54 5-14 12-5 12 5 7 14-18 4Z"/>
          <path fill="#e2ad7c" d="M19 24h18v11l-9 8-9-8Z"/>
          <path fill="#eee8d3" d="M16 26V15l9-5 13 5 2 12-13-3Z"/>
          <path fill="#d7d7c7" d="m18 20 22 2v6l-23-2Z"/>
          <path fill="#f0ead7" d="m16 23-5 13 7-3 4-9Z"/>
          <path fill="#635340" d="M22 31h3v2h-3zm10 0h3v2h-3z"/>
          <path fill="#9a764c" d="m38 42 3-2 8 13-3 2Z"/>
          <path fill="#a7afa0" d="m34 39 9-5 5 8-9 5Z"/>
        </svg>
        <span class="squad-copy"><strong>工程师 <small id="engineer-state">3 / 3</small></strong><span class="pips" aria-label="3 人"><i></i><i></i><i></i></span>
          <span id="engineer-work" class="work-progress" hidden aria-label="三名工程师的灭火进度"><span><i></i></span><span><i></i></span><span><i></i></span></span>
        </span>
      </button>
    </footer>
    <div id="battle-result" class="battle-result" hidden>
      <div class="result-card">
        <p class="result-place">吴家村 · 守村战</p>
        <h2 id="result-title">村庄守住了</h2>
        <p id="result-detail"></p>
        <button id="restart-battle" type="button">再守一次</button>
      </div>
    </div>
    <noscript>请启用 JavaScript 以查看山村沙盘。</noscript>
    <p id="error" role="alert" hidden>场景需要支持 WebGL 2 的浏览器，请检查浏览器的图形加速设置。</p>
  </main>
</body>
</html>
